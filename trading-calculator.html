<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Range split calculator: BUY and SELL levels from a high and a low.">
<title>Range Split Calculator</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg:        #0C1114;
    --surface:   #141A20;
    --raised:    #1B232A;
    --line:      #26313A;
    --line-soft: #1E272F;
    --text:      #E8EEF2;
    --muted:     #8FA0AD;
    --faint:     #63737F;
    --buy:       #2DBE86;
    --buy-soft:  rgba(45, 190, 134, 0.09);
    --buy-line:  rgba(45, 190, 134, 0.30);
    --sell:      #F0566A;
    --sell-soft: rgba(240, 86, 106, 0.09);
    --sell-line: rgba(240, 86, 106, 0.30);
    --accent:    #D8A548;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --r: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
  }

  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 28px 44px;
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 660px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- header ---------- */

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .tagline {
    margin: 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--faint);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- card ---------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--r);
    padding: 18px;
  }

  .card-title {
    margin: 0 0 14px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
  }

  /* ---------- inputs ---------- */

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    transition: border-color 120ms ease, background 120ms ease;
  }

  input[type="text"]::placeholder { color: var(--faint); }

  input[type="text"]:hover { border-color: #33414C; }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    background: #1E262E;
  }

  input[type="text"]:focus-visible {
    outline: 2px solid rgba(216, 165, 72, 0.35);
    outline-offset: 1px;
  }

  input.invalid { border-color: var(--sell); }

  /* ---------- actions ---------- */

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  button.action {
    flex: 1;
    padding: 11px 16px;
    border-radius: 9px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
  }

  .btn-primary {
    background: var(--text);
    color: #0C1114;
  }

  .btn-primary:hover { background: #FFFFFF; }

  .btn-ghost {
    flex: 0 0 auto;
    background: transparent;
    border-color: var(--line);
    color: var(--muted);
  }

  .btn-ghost:hover { color: var(--text); border-color: #3A4752; }

  button:focus-visible {
    outline: 2px solid rgba(216, 165, 72, 0.5);
    outline-offset: 2px;
  }

  /* ---------- validation ---------- */

  .notice {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 12px 0 0;
    padding: 9px 12px;
    border-radius: 9px;
    background: var(--sell-soft);
    border: 1px solid var(--sell-line);
    color: #FF98A5;
    font-size: 13px;
  }

  /* display:flex above would otherwise beat the browser's [hidden] rule. */
  .notice[hidden] { display: none; }

  .notice::before {
    content: "!";
    flex: none;
    width: 16px;
    height: 16px;
    margin-top: 2px;
    border-radius: 50%;
    background: var(--sell);
    color: #14090B;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    line-height: 16px;
    text-align: center;
  }

  /* ---------- results ---------- */

  .results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .level {
    display: block;
    width: 100%;
    padding: 18px 18px 16px;
    border-radius: var(--r);
    border: 1px solid;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: background 120ms ease;
  }

  .level-buy  { background: var(--buy-soft);  border-color: var(--buy-line); }
  .level-sell { background: var(--sell-soft); border-color: var(--sell-line); }

  .level:hover { background: var(--raised); }

  .level-buy:focus-visible {
    outline: 2px solid var(--buy);
    outline-offset: 2px;
  }

  .level-sell:focus-visible {
    outline: 2px solid var(--sell);
    outline-offset: 2px;
  }

  .level-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .level-buy  .level-head { color: var(--buy); }
  .level-sell .level-head { color: var(--sell); }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex: none;
  }

  .level-value {
    margin-top: 8px;
    font-family: var(--mono);
    font-size: clamp(30px, 8.5vw, 38px);
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .level-note {
    min-height: 1.4em;
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--accent);
  }

  footer {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--faint);
    text-align: center;
  }

  /* ---------- narrow ---------- */

  @media (max-width: 460px) {
    .field-row, .results { grid-template-columns: 1fr; }
    .actions { flex-wrap: wrap; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Trading Calculator</h1>
    <p class="tagline">Be Smart</p>
  </header>

  <section class="card">
    <h2 class="card-title">Inputs</h2>

    <div class="field-row">
      <div class="field">
        <label for="high">High Price</label>
        <input id="high" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0.00">
      </div>
      <div class="field">
        <label for="low">Low Price</label>
        <input id="low" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0.00">
      </div>
    </div>

    <div class="actions">
      <button class="action btn-primary" type="button" id="calc">Calculate</button>
      <button class="action btn-ghost" type="button" id="reset">Reset</button>
    </div>

    <p class="notice" id="notice" hidden></p>
  </section>

  <section class="results">
    <button class="level level-buy" type="button" id="buyTile">
      <span class="level-head"><span class="dot"></span>Buy Price</span>
      <div class="level-value" id="buyValue">&mdash;</div>
      <div class="level-note" id="buyNote"></div>
    </button>

    <button class="level level-sell" type="button" id="sellTile">
      <span class="level-head"><span class="dot"></span>Sell Price</span>
      <div class="level-value" id="sellValue">&mdash;</div>
      <div class="level-note" id="sellNote"></div>
    </button>
  </section>

  <footer>Tap a level to copy it.</footer>
</div>

<script>
  (function () {
    "use strict";

    var DIVISOR = 2.6;
    var DASH = "—";

    var el = {
      high: document.getElementById("high"),
      low: document.getElementById("low"),
      notice: document.getElementById("notice"),
      buyValue: document.getElementById("buyValue"),
      sellValue: document.getElementById("sellValue"),
      buyNote: document.getElementById("buyNote"),
      sellNote: document.getElementById("sellNote"),
      buyTile: document.getElementById("buyTile"),
      sellTile: document.getElementById("sellTile")
    };

    // Accepts "4335.24", "4,335.24", " 4335.24 ". Returns null when it is not a finite number.
    function parseNum(raw) {
      var cleaned = String(raw).replace(/[\s,]/g, "");
      if (cleaned === "") return null;
      if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(cleaned)) return null;
      var n = Number(cleaned);
      return isFinite(n) ? n : null;
    }

    function fmt(n, dp) {
      return (typeof n === "number" && isFinite(n)) ? n.toFixed(dp) : DASH;
    }

    function setInvalid(input, bad) {
      if (bad) { input.classList.add("invalid"); } else { input.classList.remove("invalid"); }
    }

    function clearResults() {
      el.buyValue.textContent = DASH;
      el.sellValue.textContent = DASH;
      el.buyNote.textContent = "";
      el.sellNote.textContent = "";
      el.buyTile.dataset.copy = "";
      el.sellTile.dataset.copy = "";
    }

    function showNotice(message) {
      el.notice.textContent = message;
      el.notice.hidden = false;
    }

    function hideNotice() {
      el.notice.hidden = true;
      el.notice.textContent = "";
    }

    function calculate() {
      // Both fields empty is the resting state, not an error.
      if (el.high.value.trim() === "" && el.low.value.trim() === "") {
        setInvalid(el.high, false);
        setInvalid(el.low, false);
        clearResults();
        hideNotice();
        return;
      }

      var high = parseNum(el.high.value);
      var low = parseNum(el.low.value);

      setInvalid(el.high, high === null);
      setInvalid(el.low, low === null);

      if (high === null || low === null) {
        clearResults();
        showNotice("Enter numeric values for High and Low.");
        return;
      }

      if (high <= low) {
        setInvalid(el.high, true);
        setInvalid(el.low, true);
        clearResults();
        showNotice("High must be greater than Low.");
        return;
      }

      var distance = (high - low) / DIVISOR;
      var buy = low + distance;
      var sell = high - distance;

      if (!isFinite(distance) || !isFinite(buy) || !isFinite(sell)) {
        clearResults();
        showNotice("Those numbers are too large to price. Try smaller values.");
        return;
      }

      hideNotice();

      el.buyValue.textContent = fmt(buy, 2);
      el.sellValue.textContent = fmt(sell, 2);
      el.buyNote.textContent = "";
      el.sellNote.textContent = "";
      el.buyTile.dataset.copy = fmt(buy, 2);
      el.sellTile.dataset.copy = fmt(sell, 2);
    }

    function copyLevel(tile, noteEl) {
      var value = tile.dataset.copy;
      if (!value) return;

      var done = function () {
        noteEl.textContent = "Copied " + value;
        window.setTimeout(function () {
          noteEl.textContent = "";
        }, 1200);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(done, function () {});
        return;
      }

      try {
        var tmp = document.createElement("textarea");
        tmp.value = value;
        tmp.setAttribute("readonly", "");
        tmp.style.position = "fixed";
        tmp.style.opacity = "0";
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand("copy");
        document.body.removeChild(tmp);
        done();
      } catch (err) {
        // Clipboard unavailable: the value stays on screen to read off.
      }
    }

    ["high", "low"].forEach(function (key) {
      el[key].addEventListener("input", calculate);
      el[key].addEventListener("keydown", function (event) {
        if (event.key === "Enter") calculate();
      });
    });

    document.getElementById("calc").addEventListener("click", calculate);

    document.getElementById("reset").addEventListener("click", function () {
      el.high.value = "";
      el.low.value = "";
      calculate();
      el.high.focus();
    });

    el.buyTile.addEventListener("click", function () {
      copyLevel(el.buyTile, el.buyNote);
    });

    el.sellTile.addEventListener("click", function () {
      copyLevel(el.sellTile, el.sellNote);
    });

    calculate();
  })();
</script>
</body>
</html>
